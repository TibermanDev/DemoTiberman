<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Ban (Top Nav) — Tiberman</title>
<meta name="description" content="Varian layout katalog Tiberman dengan navigasi kategori unit di bagian atas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
<script>(function(){try{var l=localStorage.getItem('tbm-lang');if(l)document.documentElement.setAttribute('lang',l==='zh'?'zh-CN':l);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/style.css?v=20260907a">
</head>
<body class="catalog catalog--topnav" data-catalog data-unit="truk-bus">

<!-- ============================= NAVBAR KATEGORI ============================= -->
<header class="nav nav--center">
  <div class="nav__inner">
    <a class="nav__logo" href="index.html"><img src="assets/img/logo-white.png" alt="Tiberman"></a>
    <button class="nav__burger" data-burger aria-label="Buka menu"><span></span></button>
    <nav class="nav__links">
      <a href="#katalog" class="is-active" data-unit="truk-bus">Truk &amp; Bus</a>
      <a href="#katalog" data-unit="mining-truck">Mining Truck</a>
      <a href="#katalog" data-unit="loader-grader">Loader-Grader</a>
      <a href="#katalog" data-unit="traktor">Traktor</a>
      <a href="#katalog" data-unit="forklift">Forklift</a>
      <a href="#katalog" data-unit="velg-tube">Velg &amp; Tube</a>
    </nav>
    <div class="nav__tools">
      <div class="lang">
        <button class="tool-btn" type="button" data-lang-btn aria-haspopup="true" aria-expanded="false">
          <span data-lang-label>ID</span>
          <svg class="lang__caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>
        </button>
        <div class="lang__menu" data-lang-menu>
          <button type="button" data-lang="id">Indonesia</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="catalog__main" id="katalog">
  <div class="catalog__banner">
    <img src="assets/img/dumptruck.webp" alt="Dump truck di area tambang" fetchpriority="high">
  </div>

  <!-- chip ukuran dibangun otomatis dari unit yang aktif (assets/js/main.js) -->
  <div class="chips" data-chips></div>

  <div class="catalog__body" data-catalog-body></div>
</main>

<footer class="footer footer--slim">
  <div class="container">
    <p class="footer__note">Copyright &copy; 2021 PT. Tiga Berlian Mandiri</p>
  </div>
</footer>

<script src="assets/js/products.js?v=20260907a"></script>
<script src="assets/js/i18n.js?v=20260907a" defer></script>
<script src="assets/js/main.js?v=20260907a" defer></script>
</body>
</html>
