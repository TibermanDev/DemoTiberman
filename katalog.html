<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Ban — Tiberman</title>
<meta name="description" content="Telusuri katalog ban truk, mining truck, loader-grader, traktor, forklift, velg & tube Tiberman berdasarkan unit dan ukuran.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('tbm-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');var l=localStorage.getItem('tbm-lang');if(l)document.documentElement.setAttribute('lang',l==='zh'?'zh-CN':l);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="catalog">

<!-- ============================= NAVBAR ============================= -->
<header class="nav nav--center">
  <div class="nav__inner">
    <a class="nav__logo" href="index.html"><img src="assets/img/logo-white.png" alt="Tiberman"></a>
    <button class="nav__burger" data-burger aria-label="Buka menu"><span></span></button>
    <nav class="nav__links">
      <a href="index.html#news">News</a>
      <a href="index.html#superarea">SuperArea</a>
      <a href="index.html#contact">Contact Us</a>
    </nav>
    <div class="nav__tools">
      <button class="tool-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Aktifkan tema gelap">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="lang">
        <button class="tool-btn" type="button" data-lang-btn aria-haspopup="true" aria-expanded="false">
          <span data-lang-label>ID</span>
          <svg class="lang__caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>
        </button>
        <div class="lang__menu" data-lang-menu>
          <button type="button" data-lang="id">Indonesia</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="catalog__layout" data-catalog data-unit="truk-bus">

  <!-- ============================= SIDEBAR ============================= -->
  <aside class="catalog__sidebar">
    <p class="side-label">Lagi cari ban apa?</p>
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input type="search" placeholder="Search" aria-label="Cari ban" data-search>
    </div>
    <div class="side-divider"></div>

    <p class="side-label">Telusuri berdasarkan unit</p>
    <div class="unitlist">
      <button type="button" class="is-active" data-unit="truk-bus">Truk &amp; Bus</button>
      <button type="button" data-unit="mining-truck">Mining Truck</button>
      <button type="button" data-unit="loader-grader">Loader-Grader</button>
      <button type="button" data-unit="traktor">Traktor</button>
      <button type="button" data-unit="forklift">Forklift</button>
      <button type="button" data-unit="velg-tube">Velg &amp; Tube</button>
    </div>

    <a class="side-promo" href="#">
      <strong>Temukan Produk Promo</strong>
      <span>Klik untuk melihat produk promo kita</span>
    </a>
    <a class="side-promo" href="#">
      <strong>Lihat Testimoni Video</strong>
      <span>Klik untuk melihat testimoni video dari customer kita</span>
    </a>
  </aside>

  <!-- ============================= MAIN ============================= -->
  <main class="catalog__main">
    <div class="catalog__banner">
      <img src="assets/img/dumptruck.webp" alt="Dump truck di area tambang" fetchpriority="high">
    </div>

    <!-- chip ukuran dibangun otomatis dari unit yang aktif (assets/js/main.js) -->
    <div class="chips" data-chips></div>

    <div class="catalog__body" data-catalog-body></div>

    <footer class="footer footer--slim">
      <div class="container">
        <p class="footer__note">Copyright &copy; 2021 PT. Tiga Berlian Mandiri</p>
      </div>
    </footer>
  </main>
</div>

<script src="assets/js/products.js"></script>
<script src="assets/js/i18n.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
